name: Refresh official data
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install -r requirements.txt
      - run: python -m etl.pipeline --refresh
      - run: python -m pytest -q
      - run: npm ci && npm run check && npm run build
      - name: Publish a data proposal branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/
          if git diff --cached --quiet; then
            echo "No data changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="automation/data-refresh-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git commit --quiet -m "data: refresh validated official snapshots"
          git push origin "$branch"
          printf 'Validated data proposal: https://github.com/%s/compare/main...%s?expand=1\n' "$GITHUB_REPOSITORY" "$branch" >> "$GITHUB_STEP_SUMMARY"
